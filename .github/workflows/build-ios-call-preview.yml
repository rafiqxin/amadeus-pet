name: Build iOS CALL preview IPA

on:
  push:
    branches:
      - chatgpt/ios-call-preview
    paths:
      - '.github/workflows/build-ios-call-preview.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Force CALL preview route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          needle = '<script type="module" src="/src/main.js"></script>'
          inject = '<script>location.hash = "#call";</script>\n  ' + needle
          if needle not in s:
              raise SystemExit("main.js script tag not found")
          p.write_text(s.replace(needle, inject))
          PY

      - name: Build renderer
        run: npm run build:render

      - name: Create Capacitor iOS shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus.callpreview",
            "appName": "AMA-DEUS CALL Preview",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          JSON
          npx cap add ios
          npx cap sync ios

      - name: Install native iOS speech bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('ios/App/App/AppDelegate.swift')
          src = app.read_text()
          if 'import Speech' not in src:
              src = src.replace('import Capacitor', 'import Capacitor\nimport Speech\nimport AVFoundation')

          plugin = r'''

// MARK: - AMA-DEUS native speech bridge
// The Web layer talks to this plugin as `Capacitor.Plugins.NativeSpeech`.
// It deliberately mirrors the small contract we will also implement on Android.
@objc(NativeSpeechPlugin)
public class NativeSpeechPlugin: CAPPlugin, CAPBridgedPlugin {
    public let identifier = "NativeSpeechPlugin"
    public let jsName = "NativeSpeech"
    public let pluginMethods: [CAPPluginMethod] = [
        CAPPluginMethod(name: "available", returnType: CAPPluginReturnPromise),
        CAPPluginMethod(name: "checkPermissions", returnType: CAPPluginReturnPromise),
        CAPPluginMethod(name: "requestPermissions", returnType: CAPPluginReturnPromise),
        CAPPluginMethod(name: "start", returnType: CAPPluginReturnPromise),
        CAPPluginMethod(name: "stop", returnType: CAPPluginReturnPromise),
    ]

    private let audioEngine = AVAudioEngine()
    private var recognitionTask: SFSpeechRecognitionTask?
    private var recognitionRequest: SFSpeechAudioBufferRecognitionRequest?
    private var pendingStartCall: CAPPluginCall?
    private var bestTranscript = ""
    private var silenceTimer: Timer?

    @objc func available(_ call: CAPPluginCall) {
        let locale = call.getString("language") ?? "zh-CN"
        let recognizer = SFSpeechRecognizer(locale: Locale(identifier: locale))
        call.resolve(["available": recognizer != nil])
    }

    private func permissionPayload() -> [String: String] {
        let speech: String
        switch SFSpeechRecognizer.authorizationStatus() {
        case .authorized: speech = "granted"
        case .denied, .restricted: speech = "denied"
        case .notDetermined: speech = "prompt"
        @unknown default: speech = "denied"
        }

        let microphone: String
        switch AVAudioSession.sharedInstance().recordPermission {
        case .granted: microphone = "granted"
        case .denied: microphone = "denied"
        case .undetermined: microphone = "prompt"
        @unknown default: microphone = "denied"
        }
        return ["speechRecognition": speech, "microphone": microphone]
    }

    @objc func checkPermissions(_ call: CAPPluginCall) {
        call.resolve(permissionPayload())
    }

    @objc func requestPermissions(_ call: CAPPluginCall) {
        SFSpeechRecognizer.requestAuthorization { [weak self] _ in
            guard let self else { return }
            AVAudioSession.sharedInstance().requestRecordPermission { _ in
                DispatchQueue.main.async {
                    call.resolve(self.permissionPayload())
                }
            }
        }
    }

    @objc func start(_ call: CAPPluginCall) {
        DispatchQueue.main.async { [weak self] in
            self?.beginRecognition(call)
        }
    }

    private func beginRecognition(_ call: CAPPluginCall) {
        guard pendingStartCall == nil else {
            call.reject("语音识别已经在运行")
            return
        }
        let perms = permissionPayload()
        guard perms["speechRecognition"] == "granted", perms["microphone"] == "granted" else {
            call.reject("需要麦克风与语音识别权限")
            return
        }

        let language = call.getString("language") ?? "zh-CN"
        guard let recognizer = SFSpeechRecognizer(locale: Locale(identifier: language)), recognizer.isAvailable else {
            call.reject("当前系统语音识别服务不可用")
            return
        }

        cleanupAudio(resolvePending: false)
        bestTranscript = ""
        pendingStartCall = call

        do {
            let session = AVAudioSession.sharedInstance()
            try session.setCategory(.record, mode: .measurement, options: [.duckOthers])
            try session.setActive(true, options: .notifyOthersOnDeactivation)

            let request = SFSpeechAudioBufferRecognitionRequest()
            request.shouldReportPartialResults = true
            recognitionRequest = request

            let input = audioEngine.inputNode
            let format = input.outputFormat(forBus: 0)
            input.installTap(onBus: 0, bufferSize: 1024, format: format) { buffer, _ in
                request.append(buffer)
            }

            recognitionTask = recognizer.recognitionTask(with: request) { [weak self] result, error in
                guard let self else { return }
                DispatchQueue.main.async {
                    if let result {
                        self.bestTranscript = result.bestTranscription.formattedString
                        self.armSilenceTimer()
                        if result.isFinal {
                            self.finishRecognition(success: true)
                            return
                        }
                    }
                    if error != nil {
                        if self.bestTranscript.isEmpty {
                            self.finishRecognition(success: false, message: "语音识别失败")
                        } else {
                            self.finishRecognition(success: true)
                        }
                    }
                }
            }

            audioEngine.prepare()
            try audioEngine.start()
            armSilenceTimer(initial: true)
        } catch {
            finishRecognition(success: false, message: "无法启动麦克风：\(error.localizedDescription)")
        }
    }

    // Finish after a short pause. This gives the CALL UI a push-to-talk feel
    // without forcing the user to press Stop after every sentence.
    private func armSilenceTimer(initial: Bool = false) {
        silenceTimer?.invalidate()
        let delay: TimeInterval = initial ? 8.0 : 1.35
        silenceTimer = Timer.scheduledTimer(withTimeInterval: delay, repeats: false) { [weak self] _ in
            guard let self else { return }
            if self.bestTranscript.isEmpty && initial {
                self.finishRecognition(success: true)
            } else if !self.bestTranscript.isEmpty {
                self.finishRecognition(success: true)
            }
        }
    }

    @objc func stop(_ call: CAPPluginCall) {
        DispatchQueue.main.async { [weak self] in
            self?.finishRecognition(success: true)
            call.resolve()
        }
    }

    private func finishRecognition(success: Bool, message: String? = nil) {
        let startCall = pendingStartCall
        pendingStartCall = nil
        let transcript = bestTranscript.trimmingCharacters(in: .whitespacesAndNewlines)
        cleanupAudio(resolvePending: false)

        guard let startCall else { return }
        if success {
            startCall.resolve(["matches": transcript.isEmpty ? [] : [transcript]])
        } else {
            startCall.reject(message ?? "语音识别失败")
        }
    }

    private func cleanupAudio(resolvePending: Bool) {
        silenceTimer?.invalidate()
        silenceTimer = nil
        if audioEngine.isRunning { audioEngine.stop() }
        audioEngine.inputNode.removeTap(onBus: 0)
        recognitionRequest?.endAudio()
        recognitionTask?.cancel()
        recognitionRequest = nil
        recognitionTask = nil
        try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)

        if resolvePending, let call = pendingStartCall {
            pendingStartCall = nil
            call.resolve(["matches": bestTranscript.isEmpty ? [] : [bestTranscript]])
        }
    }
}

public class MainViewController: CAPBridgeViewController {
    public override func capacitorDidLoad() {
        super.capacitorDidLoad()
        bridge?.registerPluginInstance(NativeSpeechPlugin())
    }
}
'''

          if 'class NativeSpeechPlugin' not in src:
              src += plugin
          app.write_text(src)

          storyboard = Path('ios/App/App/Base.lproj/Main.storyboard')
          s = storyboard.read_text()
          old = 'customClass="CAPBridgeViewController" customModule="Capacitor"'
          new = 'customClass="MainViewController" customModule="App"'
          if old not in s and 'customClass="MainViewController"' not in s:
              raise SystemExit('Could not locate Capacitor bridge view controller in Main.storyboard')
          storyboard.write_text(s.replace(old, new))
          PY

          grep -q 'class NativeSpeechPlugin' ios/App/App/AppDelegate.swift
          grep -q 'customClass="MainViewController"' ios/App/App/Base.lproj/Main.storyboard

      - name: Use original Amadeus launcher icon
        run: |
          ICON_SRC="$RUNNER_TEMP/amadeus-launcher.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          curl -L --fail \
            https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/ic_launcher-web.png \
            -o "$ICON_SRC"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DST" >/dev/null
          test -s "$ICON_DST"
          echo "Installed original Amadeus launcher artwork as iOS AppIcon"

      - name: Configure full-screen preview
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string '用于将你的语音转换为文字并发送给 Amadeus。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription '用于将你的语音转换为文字并发送给 Amadeus。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '用于语音聊天时采集你的声音。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '用于语音聊天时采集你的声音。'" "$PLIST"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry AMA-DEUS-Mobile-Native-STT-Preview-unsigned.ipa Payload
          shasum -a 256 AMA-DEUS-Mobile-Native-STT-Preview-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-Mobile-Native-STT-Preview-unsigned-IPA
          path: build/AMA-DEUS-Mobile-Native-STT-Preview-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
