name: Build iOS CALL preview IPA

on:
  push:
    branches:
      - chatgpt/ios-call-preview
    paths:
      - '.github/workflows/build-ios-call-preview.yml'
      - 'src/**'
      - 'scripts/ios-native-speech.swift'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Force CALL preview route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          needle = '<script type="module" src="/src/main.js"></script>'
          inject = '<script>location.hash = "#call";</script>\n  ' + needle
          if needle not in s:
              raise SystemExit("main.js script tag not found")
          p.write_text(s.replace(needle, inject))
          PY

      - name: Build renderer
        run: npm run build:render

      - name: Create Capacitor iOS shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus.callpreview",
            "appName": "AMA-DEUS CALL Preview",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          JSON
          npx cap add ios
          npx cap sync ios

      - name: Install native iOS speech bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('ios/App/App/AppDelegate.swift')
          src = app.read_text()
          if 'import Speech' not in src:
              src = src.replace('import Capacitor', 'import Capacitor\nimport Speech\nimport AVFoundation')
          plugin = Path('scripts/ios-native-speech.swift').read_text()
          if 'class NativeSpeechPlugin' not in src:
              src += '\n\n' + plugin
          app.write_text(src)

          storyboard = Path('ios/App/App/Base.lproj/Main.storyboard')
          s = storyboard.read_text()
          old = 'customClass="CAPBridgeViewController" customModule="Capacitor"'
          new = 'customClass="MainViewController" customModule="App"'
          if old not in s and 'customClass="MainViewController"' not in s:
              raise SystemExit('Could not locate Capacitor bridge view controller in Main.storyboard')
          storyboard.write_text(s.replace(old, new))
          PY
          grep -q 'class NativeSpeechPlugin' ios/App/App/AppDelegate.swift
          grep -q 'customClass="MainViewController"' ios/App/App/Base.lproj/Main.storyboard

      - name: Use original Amadeus launcher icon
        run: |
          ICON_SRC="$RUNNER_TEMP/amadeus-launcher.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          curl -L --fail \
            https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/ic_launcher-web.png \
            -o "$ICON_SRC"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DST" >/dev/null
          test -s "$ICON_DST"
          echo "Installed original Amadeus launcher artwork as iOS AppIcon"

      - name: Configure full-screen preview
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string '用于将你的语音转换为文字并发送给 Amadeus。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription '用于将你的语音转换为文字并发送给 Amadeus。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '用于语音聊天时采集你的声音。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '用于语音聊天时采集你的声音。'" "$PLIST"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry AMA-DEUS-Mobile-Native-STT-Preview-unsigned.ipa Payload
          shasum -a 256 AMA-DEUS-Mobile-Native-STT-Preview-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-Mobile-Native-STT-Preview-unsigned-IPA
          path: build/AMA-DEUS-Mobile-Native-STT-Preview-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
