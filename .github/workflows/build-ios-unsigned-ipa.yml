name: Build and publish AMA-DEUS iOS unsigned IPA

# Produces a sideloadable, UNSIGNED .ipa and publishes it as a GitHub Release so
# it stays downloadable (Actions artifacts expire after 30 days and require a
# signed-in session).
#
# Why this workflow exists next to build-ios-call-preview.yml:
# that one runs the FULL WKWebView XCUITest suite as a hard gate *before*
# packaging, and it sat red for seven consecutive pushes (e52239f..b3f8dab)
# while the product code itself was fine. The UI regressions are valuable but
# they are simulator-timing sensitive; letting them veto artifact delivery means
# a usable build can be one flaky animation away. Here they run as a separate,
# non-blocking job: their result is reported, never allowed to withhold the IPA.
#
# The deterministic gates stay hard: the three contract suites, the 45-voice
# routing contract, the source-level voice/interaction assertions, and the
# packaged-payload checks. Those are the ones that catch real regressions.
#
# The iOS CALL visual design is deliberately untouched by this workflow — it
# only builds what the renderer already produces.

on:
  push:
    branches:
      - chatgpt/ios-unsigned-ipa
    paths:
      - '.github/workflows/build-ios-unsigned-ipa.yml'
      - 'src/**'
      - 'tests/**'
      - 'ios-tests/**'
      - 'models/kurisu/**'
      - 'public/Resources/amadeus-reference/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

env:
  IPA_NAME: AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa
  APP_PATH: build/DerivedData/Build/Products/Release-iphoneos/App.app
  RELEASE_TAG: ios-unsigned-latest

jobs:
  # Non-blocking. Reports WKWebView interaction regressions on a simulator
  # without being able to withhold the IPA below.
  simulator-regressions:
    runs-on: macos-15
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-exact @capacitor/core@7 @capacitor/ios@7 @capacitor-community/speech-recognition@7.0.1
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Build renderer for the harness
        run: npm run build:render

      - name: Run Simulator WKWebView interaction regressions
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          devices=[]
          for runtime, items in data.get("devices", {}).items():
              if "iOS" not in runtime: continue
              for d in items:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      devices.append(d)
          chosen=next((d for d in devices if d.get("name")=="iPhone 16 Pro"), None) or (devices[0] if devices else None)
          if not chosen: raise SystemExit("No available iPhone Simulator")
          print(chosen["udid"])
          ')
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
          trap 'xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl bootstatus "$SIM_UDID" -b
          (cd ios-tests && xcodegen generate)
          xcodebuild \
            -project ios-tests/AmadeusHarness.xcodeproj \
            -scheme AmadeusHarness \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/WKWebViewHarness \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AmadeusHarnessUITests/AmadeusUITests/testCallTranscriptRealThumbChangesScrollTop \
            -only-testing:AmadeusHarnessUITests/AmadeusUITests/testLive2DCharacterTapReachesReactionAndAudio \
            test

  # Blocking. Everything here is deterministic, and it ends in the IPA.
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-exact @capacitor/core@7 @capacitor/ios@7 @capacitor-community/speech-recognition@7.0.1
          npm install --save-dev --save-exact @capacitor/cli@7
          npm ls @capacitor/core @capacitor/ios @capacitor-community/speech-recognition

      - name: Verify runtime, interaction, audio and TTS contracts
        run: |
          node tests/ios-runtime-contract.mjs
          node tests/ios-ui-audio-contract.mjs
          node tests/ios-sheet-reachability-contract.mjs
          node tests/tts-transport-contract.mjs

      - name: Verify iOS voice and interaction source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "TTS_OUTPUT_LANGUAGE = 'ja'" src/voice/tts-client.js
          grep -q "responseType: 'arraybuffer'" src/voice/tts-client.js
          grep -q "decodeNativeAudioResponse" src/voice/tts-client.js
          grep -q "CapacitorHttp" src/llm/client.js
          grep -q "CapacitorHttp" src/voice/tts-client.js
          grep -q "unlockVoiceAudio" src/voice/player.js
          grep -q "watchdog timeout" src/voice/player.js
          grep -q "beginVoiceTrace('KURISU TTS')" src/voice/pipeline.js
          for stage in CONFIG HEALTH TRANSLATE SYNTH DECODE PLAY END; do grep -R -q "'$stage'" src/voice; done
          grep -q "isIOSRuntime" src/main.js
          grep -q "onTap: ({ hit })" src/main.js
          ! grep -q "if (!isIOS) void playTouch" src/main.js
          grep -q "pointHit(event.clientX, event.clientY)" src/main.js
          ! grep -q "target === stage || target === canvas" src/main.js
          grep -q "call-scroll-track" src/ui/ios-call-scroll.js
          grep -q "call-scroll-thumb" src/ui/ios-call-scroll.js
          grep -q "thumb.addEventListener('pointerdown'" src/ui/ios-call-scroll.js
          grep -q "mobile-sheet-grab" src/ui/mobile.js
          grep -q "grab.addEventListener('pointerdown'" src/ui/mobile.js
          grep -q "mobile-voice-diagnostics" src/ui/mobile.js
          grep -q "settings.set('voice', true)" src/main.js
          if grep -q '"sound"[[:space:]]*:' models/kurisu/kurisu.model.json; then
            echo 'Kurisu model still contains embedded motion audio' >&2
            exit 1
          fi
          echo 'iOS voice and interaction source contracts hold.'

      - name: Verify 45-voice routing contract
        run: |
          node --input-type=module <<'NODE'
          import { VOICE_CATALOG } from './src/voice/catalog.js'
          import { TOUCH_REACTION_VOICE_IDS, nextTouchReaction, resetTouchReactions } from './src/pet/touch-reactions.js'
          import { splitReplyForTts } from './src/voice/pipeline.js'
          if (VOICE_CATALOG.length !== 45 || new Set(VOICE_CATALOG.map(v => v.id)).size !== 45) throw new Error('voice catalog must contain 45 unique entries')
          if (TOUCH_REACTION_VOICE_IDS.length !== 45 || new Set(TOUCH_REACTION_VOICE_IDS).size !== 45) throw new Error('touch shuffle must expose all 45 voices')
          resetTouchReactions()
          const round = Array.from({ length: 45 }, () => nextTouchReaction('body').voice)
          if (new Set(round).size !== 45) throw new Error('touch shuffle repeated before exhausting 45 voices')
          const chunks = splitReplyForTts('第一段用于测试长回复。第二段继续解释量子计算为什么困难。第三段确保长文本会被拆成安全的语音块，而不是一次生成一个巨大 WAV。'.repeat(3))
          if (chunks.length < 2 || chunks.some((x) => x.length > 72)) throw new Error('long TTS chunking contract failed')
          console.log(`Verified 45 unique touch/OGG routes and ${chunks.length} long-reply TTS chunks.`)
          NODE

      - name: Bundle 45 Kurisu reference voice clips
        shell: bash
        run: |
          set -euo pipefail
          dst="public/Resources/amadeus-voices"
          rm -rf "$dst"
          mkdir -p "$dst"
          files=(
            hello daga_kotowaru devilish_pervert i_guess nice pervert_confirmed sorry sounds_tough this_guy_hopeless
            christina gah dont_add_tina why_christina who_the_hell_christina ask_me_whatever could_i_help what_do_you_want
            what_is_it heheh huh_why_say you_sure nice_to_meet_okabe look_forward_to_working senpai_question senpai_questionmark
            senpai_what_we_talkin senpai_who_is_this senpai_please_dont_tell still_not_happy dont_call_me_like_that tm_nonsense
            tm_scientist_no_evidence tm_we_dont_know tm_you_said humans_software memory_complex secret_diary
            modifying_memories_impossible memories_christina gah_extended should_christina ok tm_not_possible pleased_to_meet_you
            pervert_idot_wanttodie
          )
          base="https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/res/raw"
          for f in "${files[@]}"; do
            curl -L --fail --retry 5 --retry-delay 2 "$base/$f.ogg" -o "$dst/$f.ogg"
            test -s "$dst/$f.ogg"
          done
          test "$(find "$dst" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"

      - name: Build renderer
        run: npm run build:render

      - name: Verify renderer payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/live2d.min.js
          test -f dist/models/kurisu/kurisu.model.json
          test "$(find dist/Resources/amadeus-voices -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"
          test ! -e dist/models/kurisu/sounds
          echo 'Renderer payload carries the Kurisu model and all 45 reference clips.'

      - name: Create Capacitor iOS shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus",
            "appName": "AMA-DEUS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "ios": {
              "preferredContentMode": "mobile",
              "appendUserAgent": "AMA-DEUS-iOS"
            }
          }
          JSON
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS app
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'CapacitorCommunitySpeechRecognition' ios/App/Podfile ios/App/Podfile.lock
          ICON_SRC="$RUNNER_TEMP/amadeus-launcher.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          curl -L --fail --retry 5 https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/ic_launcher-web.png -o "$ICON_SRC"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DST" >/dev/null
          test -s "$ICON_DST"
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'AMA-DEUS uses speech recognition so you can talk to Kurisu in Chinese.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'AMA-DEUS uses the microphone while you are speaking to Kurisu.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'AMA-DEUS uses your local network to reach the Kurisu Japanese TTS server you configure.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$PLIST"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify packaged app and package the IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$APP_PATH"
          test -d "$APP"
          grep -q '"preferredContentMode"[[:space:]]*:[[:space:]]*"mobile"' "$APP/capacitor.config.json"
          grep -q 'AMA-DEUS-iOS' "$APP/capacitor.config.json"
          test "$(find "$APP/public/Resources/amadeus-voices" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"
          # An unsigned build must carry no signature and no provisioning profile.
          test ! -e "$APP/_CodeSignature"
          test ! -e "$APP/embedded.mobileprovision"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          echo "IPA bytes: $(stat -f%z "$IPA_NAME")"

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-iOS-unsigned-IPA
          path: |
            build/${{ env.IPA_NAME }}
            build/${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish unsigned IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="build/$IPA_NAME"
          SUM="build/$IPA_NAME.sha256"
          NOTES="Unsigned AMA-DEUS iOS build. Install with AltStore, Sideloadly or Xcode —
          an unsigned IPA cannot be installed as-is, because iOS requires it to be
          re-signed with a certificate and provisioning profile you own.

          Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          What is in it:
          - Kurisu Cubism 2 CALL screen, unchanged visual design
          - LLM replies spoken through the Kurisu Japanese TTS server you configure
            (Settings -> Kurisu TTS Endpoint, e.g. http://<your-pc-lan-ip>:9881;
            a phone cannot reach 127.0.0.1)
          - tapping the character plays the 45 bundled original OGG clips
          - long subtitles scroll with a draggable track and thumb

          SHA256: $(cut -d' ' -f1 "$SUM")"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$FILE" "$SUM" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "AMA-DEUS iOS · unsigned IPA (latest)" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$FILE" "$SUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AMA-DEUS iOS · unsigned IPA (latest)" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
