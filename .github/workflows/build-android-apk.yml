name: Build AMA-DEUS Android APK

on:
  push:
    branches:
      - chatgpt/android-mobile
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          # Capacitor discovers native plugins from the app dependency graph.
          # Do not use --no-save here: the generated Android shell must see
          # SpeechRecognition as a real application dependency.
          npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor-community/speech-recognition@7.0.1
          npm install --save-dev --save-exact @capacitor/cli@7
          npm ls @capacitor/core @capacitor/android @capacitor-community/speech-recognition

      - name: Adapt renderer for Android mobile and touch reactions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.js')
          s = p.read_text()
          s = s.replace(
              "import { speak, voiceAvailable, matchReferenceVoice } from './pet/voice.js'",
              "import { speak, voiceAvailable, matchReferenceVoice, playReferenceVoice } from './pet/voice.js'"
          )
          s = s.replace(
              "import { mountMobileUi } from './ui/mobile.js'",
              "import { mountMobileUi } from './ui/mobile.js'\nimport { nextTouchReaction } from './pet/touch-reactions.js'"
          )
          s = s.replace(
              "const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)",
              "const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)\n  const isAndroid = /Android/i.test(navigator.userAgent)\n  const isMobile = isIOS || isAndroid"
          )
          s = s.replace("document.body.classList.toggle('mobile-ios', isIOS)", "document.body.classList.toggle('mobile-ios', isIOS)\n  document.body.classList.toggle('mobile-android', isAndroid)\n  document.body.classList.toggle('mobile-native', isMobile)")
          s = s.replace("if (isIOS) {\n      const r = stage.getBoundingClientRect()", "if (isMobile) {\n      const r = stage.getBoundingClientRect()")
          s = s.replace("const mobileUi = isIOS ? mountMobileUi", "const mobileUi = isMobile ? mountMobileUi")
          s = s.replace("onVoiceState() { hud.sysLog('iOS 语音输入已停用；将在 Android 版本接入') }", "onVoiceState(listening) { hud.sysLog(isAndroid ? (listening ? 'Android 语音识别：正在收音' : 'Android 语音识别：已停止') : 'iOS 语音输入已停用') }")
          s = s.replace("hud.sysLog(isIOS ? 'iOS：仅匹配原版语音反应；未命中时保持纯文字' : '语音模块初始化完成')", "hud.sysLog(isAndroid ? 'Android：语音输入已启用；原版 OGG 反应可用' : (isIOS ? 'iOS：仅匹配原版语音反应；未命中时保持纯文字' : '语音模块初始化完成'))")
          s = s.replace("if (isIOS) {\n    let resizeTimer", "if (isMobile) {\n    let resizeTimer")

          helper_needle = "  let modelTapHandled = false\n"
          helper = """  function runTouchReaction(hit) {
    const touch = nextTouchReaction(hit?.area || 'body')
    if (!touch) return
    const target = hit?.model || pet
    try { target?.setExpression?.(touch.expression) } catch {}
    try { target?.startRandomMotion?.(touch.motion, Define.PriorityForce) } catch {}

    if (!consoleOpen) bubble.say(touch.text, 2800)
    hud.aiLog(touch.text)
    hud.setCallSubtitle(touch.text)
    hud.rineHer(touch.text, { read: true, quick: true })

    const voiceOn = settings.get('voice') !== false
    const res = voiceOn ? playReferenceVoice(touch.voice, {
      onLevel: (level) => pet?.setMouthOpen(level),
      onEnd: () => pet?.setMouthOpen(0),
    }) : { played: false }
    if (!res.played) pet?.setMouthOpen(0)
    window.__amaLastTouch = { ...touch, voicePlayed: !!res.played }
  }

  let modelTapHandled = false
"""
          if helper_needle not in s:
              raise SystemExit('modelTapHandled hook not found')
          s = s.replace(helper_needle, helper, 1)

          old_tap = """    onTap({ hit }) {
      if (!hit) return
      modelTapHandled = true
      if (hit.area === 'head' || hit.area === 'mouth') hit.model.setRandomExpression()
      else hit.model.startRandomMotion(Define.MotionGroupTapBody, Define.PriorityNormal)
      sayLine(dialogue.clickLine())
    },
"""
          new_tap = """    onTap({ hit }) {
      if (!hit) return
      modelTapHandled = true
      runTouchReaction(hit)
    },
"""
          if old_tap not in s:
              raise SystemExit('Live2D tap handler not found')
          s = s.replace(old_tap, new_tap, 1)

          old_fallback = """    onClick() {
      if (modelTapHandled) { modelTapHandled = false; return }
      sayLine(dialogue.clickLine())
    },
"""
          new_fallback = """    onClick() {
      if (modelTapHandled) { modelTapHandled = false; return }
      runTouchReaction({ area: 'body', model: pet })
    },
"""
          if old_fallback not in s:
              raise SystemExit('stage click handler not found')
          s = s.replace(old_fallback, new_fallback, 1)
          p.write_text(s)

          p = Path('src/ui/mobile.css')
          s = p.read_text().replace('body.mobile-ios', 'body.mobile-native')
          p.write_text(s)

          p = Path('src/pet/voice.js')
          s = p.read_text()
          s = s.replace("const isIOS = typeof navigator !== 'undefined' && /iPad|iPhone|iPod/.test(navigator.userAgent)", "const isIOS = typeof navigator !== 'undefined' && /iPad|iPhone|iPod/.test(navigator.userAgent)\nconst isAndroid = typeof navigator !== 'undefined' && /Android/i.test(navigator.userAgent)\nconst isNativeMobile = isIOS || isAndroid")
          s = s.replace('if (isIOS) {', 'if (isNativeMobile) {')
          s = s.replace('return isIOS || ready', 'return isNativeMobile || ready')
          if 'export function playReferenceVoice(' not in s:
              s += """

// Deterministic playback path for direct touch reactions. Unlike speak(),
// this uses the bundled OGG id directly and therefore never depends on
// semantic matching, TTS availability, SpeechRecognizer or network access.
export function playReferenceVoice(file, opts = {}) {
  const line = REF.find((item) => item.file === String(file || ''))
  if (!line) {
    opts.onLevel?.(0)
    opts.onEnd?.()
    return { duration: 0, matched: null, played: false }
  }
  return playReference(line, opts)
}
"""
          p.write_text(s)
          PY

      - name: Open mobile CALL route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          needle = '<script type="module" src="/src/main.js"></script>'
          inject = '<script>location.hash = "#call";</script>\n  ' + needle
          if needle not in s:
              raise SystemExit('main.js script tag not found')
          p.write_text(s.replace(needle, inject))
          PY

      - name: Bundle 45 Amadeus reference voice clips
        shell: bash
        run: |
          set -euo pipefail
          dst="public/Resources/amadeus-voices"
          mkdir -p "$dst"
          files=(
            hello daga_kotowaru devilish_pervert i_guess nice pervert_confirmed sorry sounds_tough this_guy_hopeless
            christina gah dont_add_tina why_christina who_the_hell_christina ask_me_whatever could_i_help what_do_you_want
            what_is_it heheh huh_why_say you_sure nice_to_meet_okabe look_forward_to_working senpai_question senpai_questionmark
            senpai_what_we_talkin senpai_who_is_this senpai_please_dont_tell still_not_happy dont_call_me_like_that tm_nonsense
            tm_scientist_no_evidence tm_we_dont_know tm_you_said humans_software memory_complex secret_diary
            modifying_memories_impossible memories_christina gah_extended should_christina ok tm_not_possible pleased_to_meet_you
            pervert_idot_wanttodie
          )
          base="https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/res/raw"
          for f in "${files[@]}"; do
            curl -L --fail --retry 3 "$base/$f.ogg" -o "$dst/$f.ogg"
            test -s "$dst/$f.ogg"
          done
          test "$(find "$dst" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"

      - name: Verify touch reaction OGG bank
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { TOUCH_REACTION_VOICE_IDS } from './src/pet/touch-reactions.js'
          if (TOUCH_REACTION_VOICE_IDS.length < 10) throw new Error('touch reaction bank unexpectedly small')
          for (const id of TOUCH_REACTION_VOICE_IDS) {
            const file = `public/Resources/amadeus-voices/${id}.ogg`
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new Error(`missing touch OGG: ${id}`)
          }
          console.log(`Verified ${TOUCH_REACTION_VOICE_IDS.length} deterministic touch OGG reactions`)
          NODE

      - name: Build renderer
        run: npm run build:render

      - name: Verify deterministic touch bundle
        run: |
          grep -R -q 'playReferenceVoice' dist/assets
          grep -R -q '__amaLastTouch' dist/assets
          test "$(find dist/Resources/amadeus-voices -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"
          echo "Touch -> motion -> direct OGG path is present in renderer bundle."

      - name: Create Capacitor Android shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus",
            "appName": "AMA-DEUS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Verify native SpeechRecognition registration
        shell: bash
        run: |
          set -euo pipefail
          PLUGINS="android/app/src/main/assets/capacitor.plugins.json"
          test -f "$PLUGINS"
          cat "$PLUGINS"
          grep -q 'SpeechRecognition' "$PLUGINS"
          grep -R -q 'capacitor-community-speech-recognition' android/capacitor.settings.gradle android/app/capacitor.build.gradle
          echo "SpeechRecognition native Android plugin is registered."

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.INTERNET" />',
          ]
          for perm in perms:
            if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk
          sha256sum AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk | tee AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-Android-v0.1.0-alpha.3-debug-APK
          path: |
            AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk
            AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release android v0.1.0-alpha.3]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v0.1.0-alpha.3" \
            "AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk#AMA-DEUS Android v0.1.0 alpha 3 APK" \
            "AMA-DEUS-Android-v0.1.0-alpha.3-debug.apk.sha256#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMA-DEUS Android v0.1.0 alpha 3 · Touch Reaction" \
            --notes "Touch Reaction preview for Android/LineageOS. Tapping Kurisu now selects a deterministic local reaction, starts a real Cubism 2 motion (flick_head, pinch_in, tap_body or shake), sets the matching expression, and plays the bundled reference OGG directly by file id with audio-driven lip sync. Repeated body pokes escalate into annoyed reactions. This path is fully local and does not require SpeechRecognition, DeepSeek or network access. Also fixes invalid flickhead/pinchin motion group names." \
            --prerelease
