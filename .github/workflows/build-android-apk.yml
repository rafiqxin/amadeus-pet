name: Build AMA-DEUS Android APK

on:
  push:
    branches:
      - chatgpt/android-mobile
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor-community/speech-recognition@7.0.1
          npm install --save-dev --save-exact @capacitor/cli@7
          npm ls @capacitor/core @capacitor/android @capacitor-community/speech-recognition

      - name: Adapt renderer for Android mobile and touch reactions
        run: python3 scripts/adapt-android-mobile.py

      - name: Verify mobile touch delivery patches
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'interactions.setConsoleOpen(open && !isMobile)' src/main.js
          grep -Fq 'mobileAreaFromPoint' src/main.js
          grep -Fq 'touch-action: none !important' src/ui/mobile.css
          grep -Fq 'pointer-events: auto !important' src/ui/mobile.css
          echo 'Mobile CALL touch delivery fallback is active.'

      - name: Open mobile CALL route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          needle = '<script type="module" src="/src/main.js"></script>'
          inject = '<script>location.hash = "#call";</script>\n  ' + needle
          if needle not in s:
              raise SystemExit('main.js script tag not found')
          p.write_text(s.replace(needle, inject))
          PY

      - name: Bundle 45 Amadeus reference voice clips
        shell: bash
        run: |
          set -euo pipefail
          dst="public/Resources/amadeus-voices"
          mkdir -p "$dst"
          files=(
            hello daga_kotowaru devilish_pervert i_guess nice pervert_confirmed sorry sounds_tough this_guy_hopeless
            christina gah dont_add_tina why_christina who_the_hell_christina ask_me_whatever could_i_help what_do_you_want
            what_is_it heheh huh_why_say you_sure nice_to_meet_okabe look_forward_to_working senpai_question senpai_questionmark
            senpai_what_we_talkin senpai_who_is_this senpai_please_dont_tell still_not_happy dont_call_me_like_that tm_nonsense
            tm_scientist_no_evidence tm_we_dont_know tm_you_said humans_software memory_complex secret_diary
            modifying_memories_impossible memories_christina gah_extended should_christina ok tm_not_possible pleased_to_meet_you
            pervert_idot_wanttodie
          )
          base="https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/res/raw"
          for f in "${files[@]}"; do
            curl -L --fail --retry 3 "$base/$f.ogg" -o "$dst/$f.ogg"
            test -s "$dst/$f.ogg"
          done
          test "$(find "$dst" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"

      - name: Verify touch reaction OGG bank
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { TOUCH_REACTION_VOICE_IDS } from './src/pet/touch-reactions.js'
          if (TOUCH_REACTION_VOICE_IDS.length < 10) throw new Error('touch reaction bank unexpectedly small')
          for (const id of TOUCH_REACTION_VOICE_IDS) {
            const file = `public/Resources/amadeus-voices/${id}.ogg`
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new Error(`missing touch OGG: ${id}`)
          }
          console.log(`Verified ${TOUCH_REACTION_VOICE_IDS.length} deterministic touch OGG reactions`)
          NODE

      - name: Build renderer
        run: npm run build:render

      - name: Verify deterministic touch bundle
        run: |
          grep -R -q '__amaLastTouch' dist/assets
          test "$(find dist/Resources/amadeus-voices -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"
          echo "Touch -> motion -> direct OGG path is present in renderer bundle."

      - name: Create Capacitor Android shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus",
            "appName": "AMA-DEUS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Verify native SpeechRecognition registration
        shell: bash
        run: |
          set -euo pipefail
          PLUGINS="android/app/src/main/assets/capacitor.plugins.json"
          test -f "$PLUGINS"
          cat "$PLUGINS"
          grep -q 'SpeechRecognition' "$PLUGINS"
          grep -R -q 'capacitor-community-speech-recognition' android/capacitor.settings.gradle android/app/capacitor.build.gradle
          echo "SpeechRecognition native Android plugin is registered."

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.INTERNET" />',
          ]
          for perm in perms:
              if perm not in s:
                  s = s.replace('<application', perm + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk
          sha256sum AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk | tee AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-Android-v0.1.0-alpha.4-debug-APK
          path: |
            AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk
            AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release android v0.1.0-alpha.4]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v0.1.0-alpha.4" \
            "AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk#AMA-DEUS Android v0.1.0 alpha 4 APK" \
            "AMA-DEUS-Android-v0.1.0-alpha.4-debug.apk.sha256#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMA-DEUS Android v0.1.0 alpha 4 · Mobile Touch Fix" \
            --notes "Fixes Android/LineageOS character taps in CALL mode. Mobile presentation uses console-open, but desktop interaction logic previously treated that as a reason to disable stage taps. Mobile now keeps stage interaction enabled, applies touch-action:none/pointer-events:auto to the Live2D surface, and falls back to screen-position head/mouth/body zones when Cubism hitTest misses. Each accepted tap still drives a deterministic local motion + bundled OGG + lip sync without network dependency." \
            --prerelease