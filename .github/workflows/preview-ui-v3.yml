name: Preview Amadeus UI v3

on:
  push:
    branches:
      - chatgpt/amadeus-reference-ui
    paths:
      - '.github/workflows/preview-ui-v3.yml'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f >/dev/null

      - run: npm ci
      - run: npm run build:render

      - name: Capture boot
        shell: bash
        run: |
          mkdir -p preview
          xvfb-run -a env AMA_CAPTURE="$PWD/preview/boot.png" AMA_CAPTURE_DELAY=2500 ./node_modules/.bin/electron . --no-sandbox >preview/boot.log 2>&1 &
          pid=$!
          for i in {1..60}; do [ -s preview/boot.png ] && break; sleep 0.5; done
          test -s preview/boot.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Capture main
        shell: bash
        run: |
          xvfb-run -a env AMA_CAPTURE="$PWD/preview/main.png" AMA_CAPTURE_DELAY=18500 ./node_modules/.bin/electron . --no-sandbox >preview/main.log 2>&1 &
          pid=$!
          for i in {1..80}; do [ -s preview/main.png ] && break; sleep 0.5; done
          test -s preview/main.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Capture call
        shell: bash
        run: |
          xvfb-run -a env AMA_HASH=call AMA_CAPTURE="$PWD/preview/call.png" AMA_CAPTURE_DELAY=18500 ./node_modules/.bin/electron . --no-sandbox >preview/call.log 2>&1 &
          pid=$!
          for i in {1..80}; do [ -s preview/call.png ] && break; sleep 0.5; done
          test -s preview/call.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-ui-preview-v3
          path: preview/*.png
          if-no-files-found: error
