name: Reference screenshot bundle

on:
  push:
    branches:
      - chatgpt/amadeus-reference-ui
    paths:
      - '.github/workflows/reference-bundle.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download reference screenshots
        run: |
          mkdir -p reference
          curl -L --fail https://raw.githubusercontent.com/rafiqxin/Amadeus/master/Screenshots/Kurisuscreen.png -o reference/Kurisuscreen.png
          curl -L --fail https://raw.githubusercontent.com/rafiqxin/Amadeus/master/Screenshots/Subscreen.png -o reference/Subscreen.png
          curl -L --fail https://raw.githubusercontent.com/rafiqxin/Amadeus/master/Screenshots/Callscreen.png -o reference/Callscreen.png
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-reference-screenshots
          path: reference/*.png
          if-no-files-found: error
