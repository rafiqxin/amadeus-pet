name: Build AMA-DEUS iOS device candidate

on:
  push:
    branches:
      - chatgpt/ios-call-preview
    paths:
      - '.github/workflows/build-ios-device-candidate.yml'
      - 'src/**'
      - 'tests/**'
      - 'ios-tests/**'
      - 'models/kurisu/**'
      - 'public/Resources/amadeus-reference/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-device-candidate:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-exact @capacitor/core@7 @capacitor/ios@7 @capacitor-community/speech-recognition@7.0.1
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Verify runtime, interaction, audio and TTS contracts
        run: |
          node tests/ios-runtime-contract.mjs
          node tests/ios-ui-audio-contract.mjs
          node tests/tts-transport-contract.mjs

      - name: Bundle 45 Kurisu reference voices
        shell: bash
        run: |
          set -euo pipefail
          dst="public/Resources/amadeus-voices"
          rm -rf "$dst"
          mkdir -p "$dst"
          files=(
            hello daga_kotowaru devilish_pervert i_guess nice pervert_confirmed sorry sounds_tough this_guy_hopeless
            christina gah dont_add_tina why_christina who_the_hell_christina ask_me_whatever could_i_help what_do_you_want
            what_is_it heheh huh_why_say you_sure nice_to_meet_okabe look_forward_to_working senpai_question senpai_questionmark
            senpai_what_we_talkin senpai_who_is_this senpai_please_dont_tell still_not_happy dont_call_me_like_that tm_nonsense
            tm_scientist_no_evidence tm_we_dont_know tm_you_said humans_software memory_complex secret_diary
            modifying_memories_impossible memories_christina gah_extended should_christina ok tm_not_possible pleased_to_meet_you
            pervert_idot_wanttodie
          )
          base="https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/res/raw"
          for f in "${files[@]}"; do
            curl -L --fail --retry 5 --retry-delay 2 "$base/$f.ogg" -o "$dst/$f.ogg"
            test -s "$dst/$f.ogg"
          done
          test "$(find "$dst" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"

      - name: Build renderer
        run: npm run build:render

      - name: Verify renderer payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/live2d.min.js
          test -f dist/models/kurisu/kurisu.model.json
          test "$(find dist/Resources/amadeus-voices -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"
          test ! -e dist/models/kurisu/sounds

      - name: Run stable WKWebView interaction regressions
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          devices=[]
          for runtime, items in data.get("devices", {}).items():
              if "iOS" not in runtime: continue
              for d in items:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      devices.append(d)
          chosen=next((d for d in devices if d.get("name")=="iPhone 16 Pro"), None) or (devices[0] if devices else None)
          if not chosen: raise SystemExit("No available iPhone Simulator")
          print(chosen["udid"])
          ')
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
          trap 'xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl bootstatus "$SIM_UDID" -b
          (cd ios-tests && xcodegen generate)
          xcodebuild \
            -project ios-tests/AmadeusHarness.xcodeproj \
            -scheme AmadeusHarness \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/WKWebViewHarness \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AmadeusHarnessUITests/AmadeusUITests/testCallTranscriptRealThumbChangesScrollTop \
            -only-testing:AmadeusHarnessUITests/AmadeusUITests/testLive2DCharacterTapReachesReactionAndAudio \
            test

      - name: Create Capacitor iOS shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus",
            "appName": "AMA-DEUS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "ios": {
              "preferredContentMode": "mobile",
              "appendUserAgent": "AMA-DEUS-iOS"
            }
          }
          JSON
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS app
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'CapacitorCommunitySpeechRecognition' ios/App/Podfile ios/App/Podfile.lock
          ICON_SRC="$RUNNER_TEMP/amadeus-launcher.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          curl -L --fail --retry 5 https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/ic_launcher-web.png -o "$ICON_SRC"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DST" >/dev/null
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'AMA-DEUS uses speech recognition so you can talk to Kurisu in Chinese.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'AMA-DEUS uses the microphone while you are speaking to Kurisu.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'AMA-DEUS uses your local network to reach the Kurisu Japanese TTS server you configure.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$PLIST"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          grep -q '"preferredContentMode"[[:space:]]*:[[:space:]]*"mobile"' "$APP/capacitor.config.json"
          grep -q 'AMA-DEUS-iOS' "$APP/capacitor.config.json"
          test "$(find "$APP/public/Resources/amadeus-voices" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry AMA-DEUS-iOS-v0.2.0-alpha.6-device-candidate.ipa Payload
          shasum -a 256 AMA-DEUS-iOS-v0.2.0-alpha.6-device-candidate.ipa | tee AMA-DEUS-iOS-v0.2.0-alpha.6-device-candidate.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-iOS-v0.2.0-alpha.6-device-candidate
          path: |
            build/AMA-DEUS-iOS-v0.2.0-alpha.6-device-candidate.ipa
            build/AMA-DEUS-iOS-v0.2.0-alpha.6-device-candidate.ipa.sha256
          if-no-files-found: error
          retention-days: 30
