<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03060c" />
  <title>AMA·DEUS</title>
</head>
<body>
  <!-- Desktop handset shell. The forehead is the window drag handle: a thin
       bezel made the user miss the frame and hit the character instead, which
       fired a touch reaction mid-drag. The screen inside is the live display. -->
  <div id="phone">
    <div class="phone-top" data-drag-handle>
      <span class="phone-notch" aria-hidden="true"></span>
    </div>
    <button class="phone-key phone-key-power" data-window="quit" type="button" title="关闭 AMA-DEUS" aria-label="关闭 AMA-DEUS"></button>
    <span class="phone-key phone-key-vol phone-key-volup" aria-hidden="true"></span>
    <span class="phone-key phone-key-vol phone-key-voldown" aria-hidden="true"></span>
    <main id="stage" aria-label="AMA-DEUS Kurisu">
      <canvas id="l2d-canvas"></canvas>
      <div id="ui-root"></div>
      <span class="phone-home" aria-hidden="true"></span>
    </main>
  </div>
  <!-- Kurisu is a Cubism 2.1 .moc model. No Cubism 5/demo runtime is loaded in production. -->
  <script src="./live2d.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
