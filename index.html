<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>AMA·DEUS iOS</title>
</head>
<body>
  <div id="stage">
    <!-- Keep the established iOS CALL/HUD surface, but production now uses
         only the Kurisu Cubism 2 renderer. -->
    <canvas id="l2d-canvas2"></canvas>
    <div id="hud-root">
      <div id="chat-bar">
        <form id="chat-form">
          <span class="chat-prompt">&gt;</span>
          <input id="chat-input" autocomplete="off" spellcheck="false" placeholder="和红莉栖说点什么…" />
          <button type="submit" class="chat-send">发送</button>
        </form>
      </div>
    </div>
  </div>
  <script src="./live2d.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
