name: Build and release AMA-DEUS iOS

on:
  push:
    branches:
      - chatgpt/ios-call-preview
      - chatgpt/ios-runtime-debug
    paths:
      - '.github/workflows/build-ios-call-preview.yml'
      - 'src/**'
      - 'tests/**'
      - 'ios-tests/**'
      - 'models/kurisu/**'
      - 'public/Resources/amadeus-reference/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install renderer and Capacitor dependencies
        run: |
          npm ci
          npm install --save-exact @capacitor/core@7 @capacitor/ios@7 @capacitor-community/speech-recognition@7.0.1
          npm install --save-dev --save-exact @capacitor/cli@7
          npm ls @capacitor/core @capacitor/ios @capacitor-community/speech-recognition

      - name: Run fast unit and TTS transport tests
        run: |
          node tests/ios-runtime-contract.mjs
          node tests/ios-ui-audio-contract.mjs
          node tests/ios-sheet-reachability-contract.mjs
          node tests/tts-transport-contract.mjs

      - name: Bundle 45 Amadeus reference voice clips
        shell: bash
        run: |
          set -euo pipefail
          dst="public/Resources/amadeus-voices"
          rm -rf "$dst"
          mkdir -p "$dst"
          files=(
            hello daga_kotowaru devilish_pervert i_guess nice pervert_confirmed sorry sounds_tough this_guy_hopeless
            christina gah dont_add_tina why_christina who_the_hell_christina ask_me_whatever could_i_help what_do_you_want
            what_is_it heheh huh_why_say you_sure nice_to_meet_okabe look_forward_to_working senpai_question senpai_questionmark
            senpai_what_we_talkin senpai_who_is_this senpai_please_dont_tell still_not_happy dont_call_me_like_that tm_nonsense
            tm_scientist_no_evidence tm_we_dont_know tm_you_said humans_software memory_complex secret_diary
            modifying_memories_impossible memories_christina gah_extended should_christina ok tm_not_possible pleased_to_meet_you
            pervert_idot_wanttodie
          )
          base="https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/res/raw"
          for f in "${files[@]}"; do
            curl -L --fail --retry 5 --retry-delay 2 "$base/$f.ogg" -o "$dst/$f.ogg"
            test -s "$dst/$f.ogg"
          done
          test "$(find "$dst" -name '*.ogg' -type f | wc -l | tr -d ' ')" = "45"

      - name: Verify iOS voice and interaction source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "TTS_OUTPUT_LANGUAGE = 'ja'" src/voice/tts-client.js
          grep -q "responseType: 'arraybuffer'" src/voice/tts-client.js
          grep -q "decodeNativeAudioResponse" src/voice/tts-client.js
          grep -q "CapacitorHttp" src/llm/client.js
          grep -q "CapacitorHttp" src/voice/tts-client.js
          grep -q "unlockVoiceAudio" src/voice/player.js
          grep -q "watchdog timeout" src/voice/player.js
          grep -q "beginVoiceTrace('KURISU TTS')" src/voice/pipeline.js
          for stage in CONFIG HEALTH TRANSLATE SYNTH DECODE PLAY END; do grep -R -q "'$stage'" src/voice; done
          grep -q "isIOSRuntime" src/main.js
          grep -q "onTap: ({ hit })" src/main.js
          ! grep -q "if (!isIOS) void playTouch" src/main.js
          grep -q "pointHit(event.clientX, event.clientY)" src/main.js
          ! grep -q "target === stage || target === canvas" src/main.js
          grep -q "ama-transcript-scroll" src/ui/ios-call-scroll.js
          grep -q "touch-action: none" src/ui/ios-call-fixes.css
          ! grep -q "call-scroll-track" src/ui/ios-call-scroll.js
          ! grep -q "call-scroll-thumb" src/ui/ios-call-scroll.js
          grep -q "document.addEventListener('touchstart', onDocumentTouchStart" src/ui/ios-call-scroll.js
          grep -q "mobile-sheet-grab" src/ui/mobile.js
          grep -q "grab.addEventListener('pointerdown'" src/ui/mobile.js
          grep -q "mobile-voice-diagnostics" src/ui/mobile.js
          grep -q "settings.set('voice', true)" src/main.js
          if grep -q '"sound"[[:space:]]*:' models/kurisu/kurisu.model.json; then
            echo 'Kurisu model still contains embedded motion audio' >&2
            exit 1
          fi

      - name: Verify 45-voice routing contract
        run: |
          node --input-type=module <<'NODE'
          import { VOICE_CATALOG } from './src/voice/catalog.js'
          import { TOUCH_REACTION_VOICE_IDS, nextTouchReaction, resetTouchReactions } from './src/pet/touch-reactions.js'
          import { splitReplyForTts } from './src/voice/pipeline.js'
          if (VOICE_CATALOG.length !== 45 || new Set(VOICE_CATALOG.map(v => v.id)).size !== 45) throw new Error('voice catalog must contain 45 unique entries')
          if (TOUCH_REACTION_VOICE_IDS.length !== 45 || new Set(TOUCH_REACTION_VOICE_IDS).size !== 45) throw new Error('touch shuffle must expose all 45 voices')
          resetTouchReactions()
          const round = Array.from({ length: 45 }, () => nextTouchReaction('body').voice)
          if (new Set(round).size !== 45) throw new Error('touch shuffle repeated before exhausting 45 voices')
          const chunks = splitReplyForTts('第一段用于测试长回复。第二段继续解释量子计算为什么困难。第三段确保长文本会被拆成安全的语音块，而不是一次生成一个巨大 WAV。'.repeat(3))
          if (chunks.length < 2 || chunks.some((x) => x.length > 72)) throw new Error('long TTS chunking contract failed')
          console.log(`Verified 45 unique touch/OGG routes and ${chunks.length} long-reply TTS chunks.`)
          NODE

      - name: Build iOS renderer
        run: npm run build:render

      - name: Verify clean iOS bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/live2d.min.js
          test -f dist/models/kurisu/kurisu.model.json
          count=$(find dist/Resources/amadeus-voices -name '*.ogg' -type f | wc -l | tr -d ' ')
          test "$count" = "45"
          test ! -e dist/Core
          test ! -e dist/models/Haru
          test ! -e dist/models/Mao
          test ! -e dist/models/Wanko
          test ! -e dist/models/kurisu/sounds
          echo "Verified iOS bundle: Kurisu/Cubism2 + $count reference voices"

      - name: Install XcodeGen for WKWebView XCUITest harness
        run: brew install xcodegen

      - name: Run iOS Simulator WKWebView XCUITest regressions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          devices=[]
          for runtime, items in data.get("devices", {}).items():
              if "iOS" not in runtime: continue
              for d in items:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      devices.append(d)
          preferred=next((d for d in devices if d.get("name")=="iPhone 16 Pro"), None)
          chosen=preferred or (devices[0] if devices else None)
          if not chosen: raise SystemExit("No available iPhone Simulator")
          print(chosen["udid"])
          ')
          echo "Using simulator $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          node tests/tts-mock-server.mjs > /tmp/amadeus-mock-tts.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" >/dev/null 2>&1 || true; xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true' EXIT

          (cd ios-tests && xcodegen generate)
          xcodebuild \
            -project ios-tests/AmadeusHarness.xcodeproj \
            -scheme AmadeusHarness \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/WKWebViewHarness \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
          cat /tmp/amadeus-mock-tts.log

      - name: Create Capacitor iOS shell
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rafiqxin.amadeus",
            "appName": "AMA-DEUS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "ios": {
              "preferredContentMode": "mobile",
              "appendUserAgent": "AMA-DEUS-iOS"
            }
          }
          JSON
          npx cap add ios
          npx cap sync ios

      - name: Verify native SpeechRecognition registration
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'CapacitorCommunitySpeechRecognition' ios/App/Podfile ios/App/Podfile.lock
          echo 'SpeechRecognition native iOS pod is registered.'

      - name: Use Amadeus launcher icon
        run: |
          ICON_SRC="$RUNNER_TEMP/amadeus-launcher.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          curl -L --fail --retry 5 https://raw.githubusercontent.com/rafiqxin/Amadeus/master/app/src/main/ic_launcher-web.png -o "$ICON_SRC"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DST" >/dev/null
          test -s "$ICON_DST"

      - name: Configure iOS permissions and local TTS networking
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'AMA-DEUS uses speech recognition so you can talk to Kurisu in Chinese.'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'AMA-DEUS uses speech recognition so you can talk to Kurisu in Chinese.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'AMA-DEUS uses the microphone while you are speaking to Kurisu.'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'AMA-DEUS uses the microphone while you are speaking to Kurisu.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'AMA-DEUS uses your local network to reach the Kurisu Japanese TTS server you configure.'" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'AMA-DEUS uses your local network to reach the Kurisu Japanese TTS server you configure.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$PLIST"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify packaged runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          grep -q '"preferredContentMode"[[:space:]]*:[[:space:]]*"mobile"' "$APP/capacitor.config.json"
          grep -q 'AMA-DEUS-iOS' "$APP/capacitor.config.json"
          count=$(find "$APP/public/Resources/amadeus-voices" -name '*.ogg' -type f | wc -l | tr -d ' ')
          test "$count" = "45"
          echo "Verified packaged runtime config and $count OGG clips"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa Payload
          shasum -a 256 AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa | tee AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned-IPA
          path: |
            build/AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa
            build/AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish iOS prerelease
        if: github.ref == 'refs/heads/chatgpt/ios-call-preview' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release ios v0.2.0-alpha.6]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v0.2.0-alpha.6"
          FILE="build/AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa"
          SUM="build/AMA-DEUS-iOS-v0.2.0-alpha.6-unsigned.ipa.sha256"
          gh release create "$TAG" "$FILE" "$SUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMA-DEUS iOS v0.2.0 alpha 6 · Main Interaction Core" \
            --notes "Keeps the established iOS CALL visual design while restoring main's Cubism onTap as the primary Live2D interaction path. The coordinate/hit-test stage listener is now fallback-only. Connect no longer holds the whole app until hello.ogg ends, all media end waiters have a watchdog, and TTS exposes CONFIG/HEALTH/TRANSLATE/SYNTH/DECODE/PLAY/END diagnostics on-device. CALL long text now has a real draggable scroll track/thumb, and bottom-sheet grab handles perform real pan-to-close gestures. CI now runs fast unit/transport checks plus a real iOS Simulator WKWebView XCUITest harness for Live2D tap routing, transcript thumb scrolling, and mock TTS transport/play invocation before packaging the unsigned IPA." \
            --prerelease
